<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finalizar pedido</title>
  <meta name="robots" content="noindex">
  <meta name="description" id="meta-descricao" content="">
  <script>
    // Tema claro/escuro: a escolha salva do visitante ou, sem escolha, o escuro (a cara da loja).
    // Fica aqui no <head> para a página já abrir no tema certo, sem piscar.
    (function () {
      var t = '';
      try { t = localStorage.getItem('tema') || ''; } catch (e) {}
      if (t !== 'claro' && t !== 'escuro') {
        t = 'escuro';
      }
      document.documentElement.setAttribute('data-tema', t);
    })();
  </script>
  <link rel="icon" href="img/icone-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="img/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icone-180.png">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="finalizar">
  <!-- Finalizar pedido: precisa estar logado. Montado por js/pedidos.js. -->
  <header class="topo" id="topo"></header>
  <main class="conteudo" id="conteudo">
    <noscript><p class="aviso">Ative o JavaScript do navegador para ver os produtos da loja.</p></noscript>
  </main>
  <footer class="rodape" id="rodape"></footer>

  <script src="js/ambiente.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="dados/catalogo.js"></script>
  <script src="js/loja.js"></script>
  <script src="js/pedidos.js"></script>
</body>
</html>
